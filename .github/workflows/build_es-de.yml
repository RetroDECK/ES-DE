name: "Build ES-DE"

on:
  push:
    branches:
      - retrodeck-main
      - main
      - 'feat/**'
    paths:
      - 'resources/systems/linux/es_find_rules.xml'
      - 'resources/systems/linux/es_systems.xml'
      - 'resources/systems/linux/es_import_rules.xml'
      - 'tools/create_AppImage_RetroDECK.sh'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_KEEP_COUNT: 10

jobs:
  # ===========================================================================
  # Configure build parameters
  # ===========================================================================
  configure:
    name: Configure Build
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.config.outputs.branch }}
      release_tag: ${{ steps.config.outputs.release_tag }}
      is_latest: ${{ steps.config.outputs.is_latest }}
      is_prerelease: ${{ steps.config.outputs.is_prerelease }}
    steps:
      - name: Determine build parameters
        id: config
        run: |
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BRANCH_SAFE=$(echo "$BRANCH" | sed 's/\//-/g')

          RELEASE_TAG="${BRANCH_SAFE}-${TIMESTAMP}"

          # retrodeck-main and main are latest releases, everything else is pre-release
          if [[ "$BRANCH" == "retrodeck-main" || "$BRANCH" == "main" ]]; then
            IS_LATEST="true"
            IS_PRERELEASE="false"
            RELEASE_TYPE="Latest"
          else
            IS_LATEST="false"
            IS_PRERELEASE="true"
            RELEASE_TYPE="Pre-release ($BRANCH)"
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "is_latest=$IS_LATEST" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo ""
          echo "=========================================="
          echo "Build Configuration"
          echo "=========================================="
          echo "  Trigger:      ${{ github.event_name }}"
          echo "  Branch:       $BRANCH"
          echo "  Release tag:  $RELEASE_TAG"
          echo "  Release type: $RELEASE_TYPE"
          echo "=========================================="

  # ===========================================================================
  # Lint XML files
  # ===========================================================================
  validate:
    name: Validate Sources
    needs: configure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install linting dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Lint XML files
        run: |
          XML_FILES=(
            "resources/systems/linux/es_find_rules.xml"
            "resources/systems/linux/es_systems.xml"
            "resources/systems/linux/es_import_rules.xml"
          )

          ERRORS=0
          for xml_file in "${XML_FILES[@]}"; do
            if [[ ! -f "$xml_file" ]]; then
              echo "ERROR: File not found: $xml_file"
              ERRORS=$((ERRORS + 1))
              continue
            fi

            if ! xmllint --noout "$xml_file" 2>/dev/null; then
              echo "FAILED: $xml_file"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [[ "$ERRORS" -gt 0 ]]; then
            echo "ERROR: $ERRORS file(s) failed XML validation"
            exit 1
          fi

          echo "All XML files passed validation"

  # ===========================================================================
  # Build the AppImage
  # ===========================================================================
  build:
    name: Build AppImage
    needs: [configure, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          echo "Installing build dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-format git cmake gettext \
            libharfbuzz-dev libicu-dev libsdl2-dev \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libfreeimage-dev libfreetype6-dev libgit2-dev \
            libcurl4-openssl-dev libpugixml-dev libasound2-dev \
            libgl1-mesa-dev libpoppler-cpp-dev libpipewire-0.3-dev \
            libbluetooth-dev fuse libxml2-utils

          echo "Build dependencies installed"

      - name: Build AppImage
        run: |
          chmod +x tools/create_AppImage_RetroDECK.sh
          ./tools/create_AppImage_RetroDECK.sh

          echo "Build complete"

      - name: Verify build output
        run: |
          if [[ ! -f "ES-DE_x64_RetroDECK.AppImage" ]]; then
            echo "ERROR: AppImage not found: ES-DE_x64_RetroDECK.AppImage"
            exit 1
          fi

          APPIMAGE_SIZE=$(du -h "ES-DE_x64_RetroDECK.AppImage" | cut -f1)
          echo "AppImage built ($APPIMAGE_SIZE)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-artifact
          path: ES-DE_x64_RetroDECK.AppImage
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # Create release
  # ===========================================================================
  create-release:
    name: Create Release
    needs: [configure, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-artifact
          path: release-assets/

      - name: Create release
        run: |
          RELEASE_TAG="${{ needs.configure.outputs.release_tag }}"
          BRANCH="${{ needs.configure.outputs.branch }}"
          TITLE="ES-DE ${RELEASE_TAG}"

          FLAGS=""
          [[ "${{ needs.configure.outputs.is_prerelease }}" == "true" ]] && FLAGS="$FLAGS --prerelease"
          [[ "${{ needs.configure.outputs.is_latest }}" == "true" ]] && FLAGS="$FLAGS --latest"

          cat > release_notes.md <<EOF
          ## ES-DE Build - ${RELEASE_TAG}

          **Branch:** \`${BRANCH}\`
          **Commit:** [\`${GITHUB_SHA:0:8}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          **Built On:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

          echo "Creating release..."
          echo "  Tag:   $RELEASE_TAG"
          echo "  Title: $TITLE"

          gh release create "$RELEASE_TAG" \
            --title "$TITLE" \
            --notes-file release_notes.md \
            $FLAGS \
            release-assets/*

          echo ""
          echo "=========================================="
          echo "Release created"
          echo "  URL: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          echo "=========================================="
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # Cleanup old releases
  # ===========================================================================
  cleanup:
    name: Cleanup Old Releases
    needs: [configure, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prune old releases
        run: |
          BRANCH="${{ needs.configure.outputs.branch }}"
          BRANCH_SAFE=$(echo "$BRANCH" | sed 's/\//-/g')
          KEEP_COUNT="$RELEASE_KEEP_COUNT"

          echo "Pruning releases for branch prefix: ${BRANCH_SAFE}-"
          echo "Retention count: $KEEP_COUNT"

          RELEASES=$(gh release list --limit 1000 --json tagName,createdAt \
            -q "[.[] | select(.tagName | startswith(\"${BRANCH_SAFE}-\"))] | sort_by(.createdAt) | reverse | .[].tagName")

          TOTAL=$(echo "$RELEASES" | grep -c . || true)
          echo "Found $TOTAL release(s) for branch"

          if [[ "$TOTAL" -le "$KEEP_COUNT" ]]; then
            echo "Within retention limit - no cleanup needed"
            exit 0
          fi

          TO_DELETE=$(echo "$RELEASES" | tail -n +$((KEEP_COUNT + 1)))
          DELETE_COUNT=$(echo "$TO_DELETE" | grep -c . || true)

          echo "Deleting $DELETE_COUNT old release(s)..."

          SUCCESS=0
          FAILED=0

          while IFS= read -r release; do
            if [[ -n "$release" ]]; then
              echo "Deleting: $release"
              if gh release delete "$release" --yes --cleanup-tag; then
                SUCCESS=$((SUCCESS + 1))
              else
                echo "Failed to delete: $release"
                FAILED=$((FAILED + 1))
              fi
            fi
          done <<< "$TO_DELETE"

          echo ""
          echo "=========================================="
          echo "Cleanup complete"
          echo "  Deleted: $SUCCESS release(s)"
          if [[ "$FAILED" -gt 0 ]]; then
            echo "  Failed:  $FAILED release(s)"
          fi
          echo "=========================================="
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Build Summary
    needs: [configure, build, create-release, cleanup]
    if: always() && needs.configure.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          BRANCH="${{ needs.configure.outputs.branch }}"
          RELEASE_TAG="${{ needs.configure.outputs.release_tag }}"

          BUILD_RESULT="${{ needs.build.result }}"
          RELEASE_RESULT="${{ needs.create-release.result }}"
          CLEANUP_RESULT="${{ needs.cleanup.result }}"

          echo "## ES-DE Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release tag | \`${RELEASE_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${BUILD_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${RELEASE_RESULT} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleanup | ${CLEANUP_RESULT} |" >> $GITHUB_STEP_SUMMARY
